
name: Build Otak Scroll APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "OtakScroll-Siap-Build.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q OtakScroll-Siap-Build.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify project files
        run: |
          find OtakScroll -maxdepth 3 \
            \( -name "settings.gradle*" -o -name "build.gradle*" \) \
            -print

      - name: Build APK
        working-directory: OtakScroll
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtakScroll-debug-apk
          path: OtakScroll/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
